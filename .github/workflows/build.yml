name: Build Geode Mod
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build-android64:
    name: Android ARM64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: geode-sdk/build-geode-mod@main
        with:
          platform: android64
      - uses: actions/upload-artifact@v4
        with:
          name: lua-executor-android64
          path: build/*.geode
