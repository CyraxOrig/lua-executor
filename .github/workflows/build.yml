name: Build Geode Mod
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build-android64:
    name: Android ARM64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
      - uses: geode-sdk/build-geode-mod/setup@main
      - run: cmake -B build -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-23 -DGEODE_TARGET_PLATFORM=Android64
      - run: cmake --build build --parallel
      - uses: actions/upload-artifact@v4
        with:
          name: lua-executor-android64
          path: build/*.geode
